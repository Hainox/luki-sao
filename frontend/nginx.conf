server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Синхронно с MAX_PHOTO_SIZE_MB (20 МБ) + запас на multipart-заголовки.
    client_max_body_size 25m;

    # Настоящий адрес клиента: перед нами стоит TLS-proxy журнала обходов,
    # он кладёт адрес клиента в X-Real-IP. Доверяем этому заголовку только от
    # адресов docker-сетей: порт 8080 наружу не опубликован, так что до нас
    # доходят лишь контейнеры сети jirajura_default. Этот адрес уходит в api,
    # а оттуда — в журнал обходов, который по нему ограничивает попытки входа.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Real-IP;

    # 127.0.0.11 — DNS docker-сети. С resolver и переменной в proxy_pass
    # nginx резолвит luki-api на каждый запрос, а не один раз при старте:
    # после пересборки api его IP меняется, и без этого был бы 502 до
    # ручного перезапуска web (так уже бывало в журнале обходов).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream luki-api:8000;
        # С переменной в proxy_pass nginx не подставляет остаток пути сам —
        # передаём исходный $request_uri целиком.
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /uploads/ {
        set $api_upstream luki-api:8000;
        proxy_pass http://$api_upstream$request_uri;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Без явного no-cache мобильный Safari кэширует index.html и sw.js по
    # эвристике на сутки и дольше и просто не видит новую версию.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}

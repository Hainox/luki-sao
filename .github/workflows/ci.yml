name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/luki_sao_test
        run: pytest -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Test
        working-directory: frontend
        run: npm test

  deploy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # .env.example — заготовка с непустыми значениями: compose-файл
      # требует SECRET_KEY/POSTGRES_PASSWORD (${VAR:?…}) и без .env упадёт.
      - name: Validate production Compose configuration
        run: |
          cp .env.example .env
          docker compose -f docker-compose.prod.yml config >/dev/null
          docker compose -f docker-compose.yml config >/dev/null

      # Имя сервиса — DNS-имя во всех его сетях, а luki-api входит в
      # jirajura_default рядом с api/db/frontend/proxy журнала обходов:
      # сервис без префикса luki- перехватывал бы чужие имена (так luki-api
      # однажды стучался в БД журнала обходов вместо своей).
      - name: All production services are prefixed with luki-
        run: |
          services="$(docker compose -f docker-compose.prod.yml config --services)"
          echo "$services"
          if echo "$services" | grep -v '^luki-'; then
            echo "Сервисы выше — без префикса luki-" >&2
            exit 1
          fi

      - name: Validate nginx configuration of the web container
        run: |
          docker run --rm \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginxinc/nginx-unprivileged:1.30-alpine nginx -t

      - name: Validate shell scripts
        run: |
          bash -n deploy/scripts/backup.sh
          sh -n backend/docker-entrypoint.sh

version: 2
updates:
  - package-ecosystem: pip
    directory: backend
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: frontend
    schedule:
      interval: weekly
    groups:
      js-deps:
        patterns:
          - "*"
  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
